  <text x="646" y="101" fill="#3fb950" font-family="Arial, sans-serif" font-size="13" font-weight="700">fim: 3,913 g/L · 122,55 h</text>
  <text x="646" y="119" fill="#ff7b72" font-family="Arial, sans-serif" font-size="11">SUBSTRATE_DEPLETED</text>
  <text x="724" y="151" fill="#d4a853" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">5–7 dias</text>
  <text x="724" y="170" fill="#d4a853" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">(120–168 h)</text>
  <line x1="80" y1="374" x2="112" y2="374" stroke="#3fb950" stroke-width="4"/>
