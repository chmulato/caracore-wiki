<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="title desc">
  <title id="title">Trajetória de biomassa da Community 1.1.1</title>
  <desc id="desc">A biomassa viável simulada parte de 0,03 grama por litro, chega a 3,913 gramas por litro em 122,55 horas e o lote termina por esgotamento do substrato. A faixa separada de 120 a 168 horas contextualiza a duração de cinco a sete dias; não são dados experimentais comparáveis.</desc>
  <rect width="900" height="390" rx="12" fill="#252a30"/>
  <text x="54" y="38" fill="#e6edf3" font-family="Arial, sans-serif" font-size="20" font-weight="700">BioReator 1.1.1 × contexto de duração</text>
  <text x="54" y="63" fill="#8b949e" font-family="Arial, sans-serif" font-size="13">Biomassa viável calculada X (g/L); a referência publicada mede OD660, sem escala comum</text>
  <rect x="617" y="88" width="215" height="218" fill="#d4a853" opacity=".13"/>
  <line x1="617" y1="88" x2="617" y2="306" stroke="#d4a853" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="832" y1="88" x2="832" y2="306" stroke="#d4a853" stroke-width="2" stroke-dasharray="6 5"/>
  <g stroke="#373e47" stroke-width="1">
    <line x1="80" y1="306" x2="832" y2="306"/>
    <line x1="80" y1="257.6" x2="832" y2="257.6"/>
    <line x1="80" y1="209.1" x2="832" y2="209.1"/>
    <line x1="80" y1="160.7" x2="832" y2="160.7"/>
    <line x1="80" y1="112.2" x2="832" y2="112.2"/>
  </g>
  <g fill="#8b949e" font-family="Arial, sans-serif" font-size="12" text-anchor="end">
    <text x="69" y="310">0</text>
    <text x="69" y="262">1</text>
    <text x="69" y="213">2</text>
    <text x="69" y="165">3</text>
    <text x="69" y="116">4</text>
  </g>
  <g fill="#8b949e" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">
    <text x="80" y="327">0</text>
    <text x="187" y="327">24</text>
    <text x="295" y="327">48</text>
    <text x="402" y="327">72</text>
    <text x="510" y="327">96</text>
    <text x="617" y="327">120</text>
    <text x="724" y="327">144</text>
    <text x="832" y="327">168</text>
  </g>
  <text x="456" y="350" fill="#8b949e" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">Tempo simulado (h)</text>
  <text x="25" y="197" fill="#8b949e" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" transform="rotate(-90 25 197)">Biomassa viável X (g/L)</text>
  <polyline points="80,304.5 187.4,303.0 294.9,297.5 402.3,281.1 509.7,233.8 617.1,116.7 628.5,116.4" fill="none" stroke="#3fb950" stroke-width="4" stroke-linejoin="round"/>
  <line x1="628.5" y1="88" x2="628.5" y2="306" stroke="#ff7b72" stroke-width="2" stroke-dasharray="5 4"/>
  <g fill="#3fb950">
    <circle cx="80" cy="304.5" r="4"/>
    <circle cx="187.4" cy="303.0" r="4"/>
    <circle cx="294.9" cy="297.5" r="4"/>
    <circle cx="402.3" cy="281.1" r="4"/>
    <circle cx="509.7" cy="233.8" r="4"/>
    <circle cx="617.1" cy="116.7" r="4"/>
    <circle cx="628.5" cy="116.4" r="5"/>
